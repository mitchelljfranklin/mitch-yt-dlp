name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo. release.yml separately needs
# contents: write to publish the release and asset.
permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --upgrade -r requirements-dev.txt
      - run: ruff check src tests setup_ffmpeg.py
      - run: ruff format --check src tests setup_ffmpeg.py

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --upgrade -r requirements-dev.txt
      - run: pytest

  build:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --upgrade -r requirements.txt
      - run: python setup_ffmpeg.py
      - run: python -m PyInstaller build.spec
      - uses: actions/upload-artifact@v7
        with:
          name: Mitch-yt-dlp
          path: dist/Mitch-yt-dlp.exe
