name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5b53490de89f9f27fd63cb4f02617ed6 # v5.5.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  build:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5b53490de89f9f27fd63cb4f02617ed6 # v5.5.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python setup_ffmpeg.py
      - run: pyinstaller build.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Mitch-yt-dlp
          path: dist/Mitch-yt-dlp.exe
