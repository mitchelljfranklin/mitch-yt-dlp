name: Build

on:
  push:
    branches: [main, dotnet]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MitchYtDlp.sln

      - name: Build
        run: dotnet build MitchYtDlp.sln --no-restore -c Release

      - name: Download tools
        shell: pwsh
        run: .\build.ps1 -SkipPublish

      - name: Publish
        run: dotnet publish src/MitchYtDlp -c Release -o dist --self-contained -r win-x64 -p:PublishSingleFile=true

      - uses: actions/upload-artifact@v4
        with:
          name: MitchYtDlp
          path: dist/MitchYtDlp.exe
